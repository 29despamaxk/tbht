<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #toolbar {
      height: 45px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px;
      background: #eee;
    }

    #urlBox {
      width: 480px;
      padding: 7px;
    }

    button {
      padding: 7px 10px;
      cursor: pointer;
    }

    #viewer {
      display: block;
      width: 100%;
      height: calc(100vh - 45px);
      border: none;
    }
  </style>
</head>

<body>

  <div id="toolbar">
    <button id="backButton">&lt;</button>

    <input
      id="urlBox"
      type="text"
      placeholder="https://example.com"
    >

    <button id="iframeButton">
      Load Page by iFrame
    </button>

    <button id="proxyButton">
      Load Page by Proxy
    </button>

    <button id="youtubeButton">
      Load YouTube
    </button>
  </div>

  <iframe
    id="viewer"
    src="https://www.bing.com"
    title="Web Viewer">
  </iframe>

  <script src="script.js"></script>
</body>
</html>
